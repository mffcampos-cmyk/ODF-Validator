- id: SWM_NAME_CODE
  applies_to:
    disciplines:
    - SWM
  primitive: code_membership
  target: .//Record/Description[@Name]
  attribute: Name
  params:
    codeset: RECORD
    field: ENG_Description
  severity: warning
  scope: message
  source_ref: 'ODF_SWM_Data_Dictionary.pdf line 1868: Record description (not code) from Common Codes.
    Narrowed from .//*[@Name] to .//Record/Description[@Name]: the XSD declares @Name on seven complexTypes
    (teamofteamscompositionType, teamType, horseType, competitorAchievementDataType, teamBIOType, horseBIOType,
    brokenRecordDescriptionType) and only Competition/Record/Description is a record description (ODF_SWM_Data_Dictionary.md
    line 1097: "Name | M | CC@RECORD ENG Description"); the other six are relay/team names and biography
    text, so real team names like "UNITED STATES" were flagged on essentially every SWM team result (item4
    a rules review).'
  status: active
