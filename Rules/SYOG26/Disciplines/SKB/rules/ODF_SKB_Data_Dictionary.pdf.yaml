- id: SKB_UNIT_CODE
  applies_to:
    disciplines:
    - SKB
  primitive: code_membership
  target: .//Configs/Config[@Unit]
  attribute: Unit
  params:
    codeset: PHASE
  severity: warning
  scope: message
  source_ref: 'ODF_SKB_Data_Dictionary.pdf line 1450 (line reference predates a converter change):
    "Element: Competition /Configs /Config (1,N) ... Unit | M | CC@Phase Code | Full RSC
    of the Phase." governs @Unit only on Competition/Configs/Config. The prior target
    .//*[@Unit] applied it to every @Unit in the message, including Competitor/@Unit
    (a GEN EVENT_UNIT RSC per GEN DD line 1272), so only ~26% of conforming unit codes
    passed. Narrowed to the Config element the DD actually describes
    (rule-content-fixes audit).'
  status: active
