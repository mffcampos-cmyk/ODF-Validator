- id: ATH_POS_POSINT
  applies_to:
    disciplines:
    - ATH
  primitive: value_format
  target: .//*[@Pos]
  attribute: Pos
  params:
    regex: ^[0-9]+$
    context_attr: Code
    context_values:
    - INTERMEDIATE
    - ORDER_FINAL
  severity: warning
  scope: message
  source_ref: 'ODF_ATH_Data_Dictionary.pdf line 1722: If more than one record send 1, 2.. PROVISIONAL,
    narrowed in a rules review: the evidence for how broadly @Pos is numeric is disputed and cannot
    be settled without the real message corpus, so this error-severity rule is deliberately under-scoped
    rather than over-scoped. Restricted via context_attr/context_values to the ExtendedResult/Extension
    @Code values ODF_ATH_Data_Dictionary.md documents as numeric for @Pos: INTERMEDIATE ("Positive Integer",
    line 899) and ORDER_FINAL ("#0", "Send 3 or 5 for the order after 3rd or 5th attempt", line 1002).
    Every other @Code sharing the tag -- including FALSE_START, documented with @Pos "G, 2" at line 885
    -- is intentionally left unchecked by this rule; do not read this list as a settled/complete enumeration.
    Image/@Pos is covered separately by ATH_POS_POSINT_IMAGE. The basis is disputed: the ATH DD''s numeric
    statement is scoped to particular Extension @Code values while the XSD types @Pos as xs:string in
    25 of 27 declarations. Downgraded error -> warning (owner decision): where the documentation
    contradicts itself, report but do not fail.'
  status: active
- id: ATH_POS_POSINT_IMAGE
  applies_to:
    disciplines:
    - ATH
  primitive: value_format
  target: .//Image[@Pos]
  attribute: Pos
  params:
    regex: ^[0-9]+$
  severity: error
  scope: message
  source_ref: 'ODF_ATH_Data_Dictionary.md line 2064: Element Competition /Image (1,N), Pos M "1" "Always
    send 1." -- documents Image/@Pos as a positive integer (picture number), separately from the ExtendedResult/Extension
    @Code cases ATH_POS_POSINT now covers narrowly. Split out in a rules review when ATH_POS_POSINT
    was narrowed via context_attr to Code-named contexts, which would otherwise have silently dropped
    Image coverage since <Image> carries no @Code sibling to match against.'
  status: active
