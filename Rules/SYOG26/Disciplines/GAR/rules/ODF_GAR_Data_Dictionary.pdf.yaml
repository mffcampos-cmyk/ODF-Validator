- id: GAR_POS_POSINT
  applies_to:
    disciplines:
    - GAR
  primitive: value_format
  target: .//*[@Pos]
  attribute: Pos
  params:
    regex: ^[0-9]+$
    context_attr: Code
    context_values:
    - STAGE
    - NEED
    - SCORE
    - DIFFICULTY
    - EXECUTION
    - STICK_BONUS
    - VAULT_BONUS
    - PENALTY
    - IRM
    - INQUIRY
    - ROTATION
  severity: warning
  scope: message
  source_ref: 'ODF_GAR_Data_Dictionary.pdf line 1723: Number for ranks 1, 2, 3. PROVISIONAL, narrowed
    a rules review: the evidence for how broadly @Pos is numeric is disputed and cannot be settled
    without the real message corpus, so this error-severity rule is deliberately under-scoped rather than
    over-scoped. Restricted via context_attr/context_values to the @Code values ODF_GAR_Data_Dictionary.md
    documents as numeric for @Pos: ExtendedResult Code=STAGE ("Positive Integer", line 1062) and its nested
    Extension Code=NEED ("Positive Integer, Number for ranks 1, 2, 3", line 1067); ExtendedResult Codes
    SCORE/DIFFICULTY/EXECUTION/STICK_BONUS/ VAULT_BONUS/PENALTY/IRM/INQUIRY ("1, 2" -- vault number, lines
    789-816, 1072-1097, 1246-1269); and EventUnitEntry Code=ROTATION ("Positive Integer", lines 852/889).
    Any other @Code sharing the tag (e.g. a generic Extension the GAR DD never speaks to) is intentionally
    left unchecked by this rule; do not read this list as a settled/complete enumeration. The basis is
    disputed: the GAR DD''s numeric statement is scoped to Extension[Code=NEED] while the XSD types @Pos
    as xs:string in 25 of 27 declarations. Downgraded error -> warning (owner decision): where
    the documentation contradicts itself, report but do not fail.'
  status: active
