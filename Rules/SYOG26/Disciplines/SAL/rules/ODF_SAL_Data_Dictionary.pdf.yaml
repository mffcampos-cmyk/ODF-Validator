- id: SAL_FUNCTION_CODE
  applies_to:
    disciplines:
    - SAL
  primitive: code_membership
  target: .//*[@Function]
  attribute: Function
  params:
    codeset: DISCIPLINE_FUNCTION
    exclude_tags:
    - Presenter
    - SignedBy
  severity: warning
  scope: message
  source_ref: 'ODF_SAL_Data_Dictionary.pdf line 3015: Function of the Signed person.
    Excludes Presenter for the same reason as GEN_FUNCTION_CODE (SCGEN@Presenter,
    not DISCIPLINE_FUNCTION). Excludes SignedBy tag-wide because SAL redefines Decision/SignedBy/@Function
    as free-text S(30) (ODF_SAL_Data_Dictionary.md line 1710), unlike GEN which documents
    it as CC@DISCIPLINE_FUNCTION Id; a tag-level exclusion cannot distinguish Decision/SignedBy
    from Protest/SignedBy, which SAL still documents as CC@DISCIPLINE_FUNCTION Id
    (line 1828), so that coverage is restored by SAL_PROTEST_SIGNEDBY_FUNCTION_CODE
    (a rules review).'
  status: active
- id: SAL_PROTEST_SIGNEDBY_FUNCTION_CODE
  applies_to:
    disciplines:
    - SAL
  primitive: code_membership
  target: .//Protest/SignedBy[@Function]
  attribute: Function
  params:
    codeset: DISCIPLINE_FUNCTION
  severity: warning
  scope: message
  source_ref: 'ODF_SAL_Data_Dictionary.md line 1828: Competition/Communication/ Protest/SignedBy/@Function
    is Function of the Signed person, CC@DISCIPLINE_ FUNCTION Id -- restores the coverage
    SAL_FUNCTION_CODE''s tag-wide SignedBy exclusion drops, since Decision/SignedBy
    (free-text S(30), line 1710) and Protest/SignedBy (CC@DISCIPLINE_FUNCTION Id,
    line 1828) share a tag but not a format (a rules review).'
  status: active
