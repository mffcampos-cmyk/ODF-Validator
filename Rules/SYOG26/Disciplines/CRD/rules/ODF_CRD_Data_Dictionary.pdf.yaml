- id: CRD_TEAMTYPE_CODE
  applies_to:
    disciplines:
    - CRD
  primitive: code_membership
  target: .//*[@TeamType]
  attribute: TeamType
  params:
    codeset: SC@TeamType@GEN
  severity: warning
  scope: message
  source_ref: 'ODF_CRD_Data_Dictionary.pdf line 620 (line reference predates a converter change):
    "TeamType | M | CC@DISCIPLINE_GENDER Gender | Send the team type. ... Use ORG" -- the
    DD is internally inconsistent: it names the DISCIPLINE_GENDER codeset (34-char RSCs)
    but its own instruction is "Use ORG", which is not a gender RSC. SC@TeamType@CRD does
    not exist in the Common Codes SPORT_CODES sheet; SC@TeamType@GEN does, and contains
    ORG (plus CPLM/CPLP/CPLW/CUSTOM), matching the DD''s own example. Rule deliberately
    departs from the DD''s stated codeset to follow its worked example instead -- same
    class of documented DD typo as SHEDULESTATUS. Pattern
    matches the correct sibling ARC_TEAMTYPE_VALID (SC@TeamType@ARC) (rule-content-fixes
    audit).'
  status: active
