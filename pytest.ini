[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Scratch directories are relocated into .pytest_tmp/ by the root conftest.py,
# via PYTEST_DEBUG_TEMPROOT rather than --basetemp. See that file for why the
# distinction matters -- --basetemp wipes the directory at session start.
addopts = -v

markers =
    needs_populated_ruleset: requires the IOC source documents to have been imported

# Cosmetic only: a prerelease Starlette warns that its TestClient optional
# dependency was renamed (httpx -> httpx2). Not an app or test defect. The
# filter below is scoped to this exact message so every other warning shows.
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated
